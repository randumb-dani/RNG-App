[package]
name = "rng-app"
version = "2.0.0"
description = "Random value generator"
authors = ["Randumb"]
license = ""
rust-version = "1.70"
edition = "2021"

[lib]
name = "rng_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
lazy_static = "1"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1

[target.'cfg(windows)'.profile.release]
rustflags = ["-Clink-args=-Wl,--subsystem,windows"]
